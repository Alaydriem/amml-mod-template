name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}/__MOD__

defaults:
  run:
    working-directory: __MOD__

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: __MOD__

      - uses: jdx/mise-action@v2
        with:
          working_directory: __MOD__

      - uses: taiki-e/install-action@nextest

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            __MOD__/target
          key: cargo-${{ hashFiles('__MOD__/Cargo.lock', '__MOD__/rust-toolchain.toml') }}
          restore-keys: |
            cargo-

      - run: mise run check
      - run: mise run test
      - run: mise run package

      - uses: actions/upload-artifact@v7
        with:
          name: __NAMESPACE__-__MOD__-${{ github.sha }}-windows-x64
          path: __MOD__/dist/@__NAMESPACE__/__MOD__/
