[tasks.preflight]
description = "Names a missing toolchain or tool before a build turns it into an obscure error"
dir = "{{config_root}}"
run = [
  "rustc --version",
  "cargo --version",
  "cargo nextest --version",
]

[tasks.check]
description = "Compiles, runs clippy with warnings denied and checks formatting"
dir = "{{config_root}}"
run = [
  "cargo check --workspace --all-targets",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo fmt --all --check",
]

[tasks.test]
description = "Every test through cargo nextest run"
dir = "{{config_root}}"
run = "cargo nextest run --workspace --no-tests=warn"

[tasks.package]
description = "Builds dist/@__NAMESPACE__/__MOD__/ (__NAMESPACE_____MOD_SNAKE__.dll, amml.hcl), the release artifact"
dir = "{{config_root}}"
shell = "bash -c"
run = '''
set -e
cargo build --release -p __MOD__-amml
rm -rf dist/@__NAMESPACE__/__MOD__
mkdir -p dist/@__NAMESPACE__/__MOD__
cp target/release/__NAMESPACE_____MOD_SNAKE__.dll dist/@__NAMESPACE__/__MOD__/__NAMESPACE_____MOD_SNAKE__.dll
cp src/amml/amml.hcl dist/@__NAMESPACE__/__MOD__/amml.hcl
cp src/amml/icon.png dist/@__NAMESPACE__/__MOD__/icon.png
if find dist -name '*.pdb' | grep -q .; then echo "a .pdb is in dist/; debug symbols are never shipped"; exit 1; fi
echo "built dist/@__NAMESPACE__/__MOD__"
'''

[tasks.install]
description = "Runs package, then copies dist/@__NAMESPACE__/__MOD__ into mods/amml/@__NAMESPACE__/__MOD__ of an AMML instance under %LOCALAPPDATA%/amml/instances (--instance, required). The mod's config/ stays. Close the game first: a running game locks the DLL"
depends = ["package"]
dir = "{{config_root}}"
shell = "bash -c"
usage = '''
flag "--instance <name>" required=#true help="The instance folder under %LOCALAPPDATA%/amml/instances"
'''
run = '''
set -e
[ -n "$LOCALAPPDATA" ] || { echo "LOCALAPPDATA is not set; the instances live under %LOCALAPPDATA%/amml/instances"; exit 1; }
instance="$LOCALAPPDATA/amml/instances/${usage_instance:?--instance is required}"
[ -f "$instance/Minecraft.Windows.exe" ] || { echo "no instance at $instance"; exit 1; }
target="$instance/mods/amml/@__NAMESPACE__/__MOD__"
mkdir -p "$target"
cp -r dist/@__NAMESPACE__/__MOD__/. "$target/"
echo "installed dist/@__NAMESPACE__/__MOD__ -> $target"
'''
